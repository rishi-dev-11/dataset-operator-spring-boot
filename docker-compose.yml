services:
  postgres:
    image: postgres:16-alpine
    container_name: dataset-operator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataset_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataset_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataset-operator-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/dataset_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      PORT: 8080

volumes:
  postgres_data:
    driver: local